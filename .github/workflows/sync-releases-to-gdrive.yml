name: Direct Cloud-to-Drive 4K60 MAX CINEMA Auto-Sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target (all, assemble_only, 1, 2, 3, 4, 5, 6, 7)"
        required: false
        default: "all"

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. RENDER 4K60 SHARDS IN PARALLEL (7 PROJECTS: 1..7, 6 SHARDS EACH = 42 JOBS)
  # =========================================================================
  render-batch5-shards:
    if: ${{ github.event.inputs.target != 'assemble_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        proj: [1, 2, 3, 4, 5, 6, 7]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Filter Target Project
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CURRENT_PROJ="${{ matrix.proj }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "all" ] && [ "$TARGET" != "$CURRENT_PROJ" ]; then
            echo "Skipping Project $CURRENT_PROJ (Target is $TARGET)"
            exit 0
          fi

      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Check If Shard Already Rendered
        id: check_shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHARD_MP4=$(printf "b5_shard_%02d_%02d.mp4" "${{ matrix.proj }}" "${{ matrix.shard }}")
          if gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${SHARD_MP4}$"; then
            echo "Shard ${SHARD_MP4} already exists on GitHub Release - skipping render!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Multimedia Stack
        if: steps.check_shard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy gdown yt-dlp

      - name: Render 4K60 Shard ${{ matrix.shard }}/6 for Project ${{ matrix.proj }}
        if: steps.check_shard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          python3 scripts/festival_parade_master_pipeline.py "${{ matrix.proj }}" \
            --manifest parade_batch5_manifest.json \
            --shard-prefix b5_shard \
            --shard-idx "${{ matrix.shard }}" \
            --num-shards 6

          echo "Uploading rendered shard to GitHub Release..."
          gh release upload parade-4k60-max-cinema output_parade/b5_shard_* --clobber

  # =========================================================================
  # 2. ASSEMBLE 6 SHARDS & SYNC DIRECTLY TO GOOGLE DRIVE
  # =========================================================================
  assemble-batch5-projects:
    needs: render-batch5-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        proj: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Filter Target Project
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CURRENT_PROJ="${{ matrix.proj }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "all" ] && [ "$TARGET" != "assemble_only" ] && [ "$TARGET" != "$CURRENT_PROJ" ]; then
            echo "Skipping Project $CURRENT_PROJ (Target is $TARGET)"
            exit 0
          fi

      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Rclone & Headless Stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy

      - name: Check All 6 Shards & Assemble to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          IDX="${{ matrix.proj }}"
          SHARD_PREFIX=$(printf "b5_shard_%02d_" "$IDX")
          DRIVE_ID="1akFdFkw3zjh4jukGMgRRn7ujATdAXb_o"

          mkdir -p ~/.config/rclone output_parade
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          echo "Verifying availability of 6 shards on GitHub Release for Project $IDX..."
          RELEASE_ASSETS=$(gh release view parade-4k60-max-cinema --json assets -q ".assets[].name")
          ALL_SHARDS_EXIST=1
          for s in 00 01 02 03 04 05; do
            if ! echo "$RELEASE_ASSETS" | grep -q "^${SHARD_PREFIX}${s}.mp4$"; then
              echo "MISSING SHARD: ${SHARD_PREFIX}${s}.mp4"
              ALL_SHARDS_EXIST=0
            fi
          done

          if [ "$ALL_SHARDS_EXIST" -ne 1 ]; then
            echo "Not all 6 shards are ready for Project $IDX. Skipping assembly for this run."
            exit 0
          fi

          echo "Downloading 6 shards for Project $IDX..."
          gh release download parade-4k60-max-cinema -p "${SHARD_PREFIX}*" -D output_parade --clobber

          echo "Assembling 6 shards + Mixing continuous 48kHz audio score..."
          python3 scripts/festival_parade_master_pipeline.py "$IDX" \
            --manifest parade_batch5_manifest.json \
            --shard-prefix b5_shard \
            --assemble-shards 6

          FINAL_MP4=$(ls output_parade/*_4K60_MAX_CINEMA.mp4 2>/dev/null | head -n 1)
          if [ -z "$FINAL_MP4" ]; then
            echo "ERROR: Final assembled MP4 not found in output_parade/!"
            exit 1
          fi
          echo "Found assembled MP4: $FINAL_MP4 ($(du -h "$FINAL_MP4" | cut -f1))"

          UPLOAD_SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "=== Upload attempt $attempt/5 to Google Drive ($DRIVE_ID) ==="
            if rclone copy output_parade/ "gdrive,root_folder_id=${DRIVE_ID}:Rendered_4K60_Parade_MAX_CINEMA/" \
              --transfers 1 --checkers 2 --drive-chunk-size 128M --multi-thread-streams 0 \
              --bwlimit 40M --tpslimit 10 --timeout 15m --contimeout 2m \
              --retries 3 --retries-sleep 20s --stats 30s -v; then
              UPLOAD_SUCCESS=1
              echo "Google Drive upload SUCCEEDED!"
              break
            fi
            echo "Upload attempt $attempt failed. Waiting 60s cooldown..."
            sleep 60
          done

          if [ "$UPLOAD_SUCCESS" -ne 1 ]; then
            echo "CRITICAL: Upload to Google Drive failed after 5 attempts!"
            exit 1
          fi

          echo "Cleaning up temporary release shard assets..."
          for s in 00 01 02 03 04 05; do
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.mp4" -y || true
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.json" -y || true
          done
          echo "Project $IDX successfully completed and synced to Google Drive!"
