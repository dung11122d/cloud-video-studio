name: Direct Cloud-to-Drive 4K60 MAX CINEMA Auto-Sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Batch to render & sync (batch4, batch3)"
        required: false
        default: "batch4"

jobs:
  # =========================================================================
  # BATCH 4 (Today's 5 Projects -> Google Drive 1KOMnttdO_NvTWXCSnZU8B0y8DjOjnQa3)
  # =========================================================================
  render-batch4-shards:
    if: ${{ github.event.inputs.target == 'batch4' || github.event.inputs.target == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        proj: [1, 2, 3, 4, 5]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Multimedia & Rclone Stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip python3-pip python3-opencv python3-numpy
          pip3 install --break-system-packages -q gdown yt-dlp
          curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y -qq rclone

      - name: Render 1.0s Opacity-Blend 4K60 Shard ${{ matrix.shard }}/6 for Batch4 Project 0${{ matrix.proj }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          SHARD_MP4=$(printf "b4v2_shard_%02d_%02d.mp4" "${{ matrix.proj }}" "${{ matrix.shard }}")
          if gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${SHARD_MP4}$"; then
            echo "✅ ${SHARD_MP4} already exists on release — skipping!"
            exit 0
          fi

          mkdir -p ~/.config/rclone
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          python3 scripts/festival_parade_master_pipeline.py "${{ matrix.proj }}" \
            --manifest parade_batch4_manifest.json \
            --shard-prefix b4v2_shard \
            --shard-idx "${{ matrix.shard }}" \
            --num-shards 6

          gh release upload parade-4k60-max-cinema output_parade/b4v2_shard_* --clobber

  assemble-batch4-projects:
    if: ${{ always() && (github.event.inputs.target == 'batch4' || github.event.inputs.target == '') }}
    needs: render-batch4-shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        proj: [1, 2, 3, 4, 5]
    steps:
      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Multimedia & Rclone Stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip python3-pip python3-opencv python3-numpy
          curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y -qq rclone

      - name: Assemble 6 Shards & Upload Batch4 Project 0${{ matrix.proj }} to Google Drive (1KOMnttdO_NvTWXCSnZU8B0y8DjOjnQa3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          IDX="${{ matrix.proj }}"
          SHARD_PREFIX=$(printf "b4v2_shard_%02d_" "$IDX")
          DRIVE_ID="1KOMnttdO_NvTWXCSnZU8B0y8DjOjnQa3"

          mkdir -p ~/.config/rclone output_parade
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          gh release download parade-4k60-max-cinema -p "${SHARD_PREFIX}*" -D output_parade --clobber
          python3 scripts/festival_parade_master_pipeline.py "$IDX" \
            --manifest parade_batch4_manifest.json \
            --shard-prefix b4v2_shard \
            --assemble-shards 6

          sleep $(( IDX * 10 ))
          for attempt in 1 2 3 4; do
            if rclone copy output_parade/ "gdrive,root_folder_id=${DRIVE_ID}:Rendered_4K60_Parade_MAX_CINEMA/" \
              --transfers 4 --checkers 8 --drive-chunk-size 128M --multi-thread-streams 4 \
              --retries 6 --retries-sleep 15s -v; then
              break
            fi
            echo "Retry $attempt after Google Drive 429 cooldown..."
            sleep $(( attempt * 20 ))
          done

          for s in 00 01 02 03 04 05; do
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.mp4" -y || true
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.json" -y || true
          done

  # =========================================================================
  # BATCH 3 RE-EXPORT (Yesterday's 6 Projects -> Google Drive 1_QCDdqFbGcN8bBJ105ZuHYDG-wdPy5Xq)
  # =========================================================================
  render-batch3-shards:
    if: ${{ github.event.inputs.target == 'batch3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        proj: [1, 2, 3, 4, 5, 6]
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Multimedia & Rclone Stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip python3-pip python3-opencv python3-numpy
          pip3 install --break-system-packages -q gdown yt-dlp
          curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y -qq rclone

      - name: Render 1.0s Opacity-Blend 4K60 Shard ${{ matrix.shard }}/6 for Batch3 Project 0${{ matrix.proj }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          SHARD_MP4=$(printf "b3v2_shard_%02d_%02d.mp4" "${{ matrix.proj }}" "${{ matrix.shard }}")
          if gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${SHARD_MP4}$"; then
            echo "✅ ${SHARD_MP4} already exists on release — skipping!"
            exit 0
          fi

          mkdir -p ~/.config/rclone
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          python3 scripts/festival_parade_master_pipeline.py "${{ matrix.proj }}" \
            --manifest parade_batch3_manifest.json \
            --shard-prefix b3v2_shard \
            --shard-idx "${{ matrix.shard }}" \
            --num-shards 6

          gh release upload parade-4k60-max-cinema output_parade/b3v2_shard_* --clobber

  assemble-batch3-projects:
    if: ${{ always() && github.event.inputs.target == 'batch3' }}
    needs: render-batch3-shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        proj: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Multimedia & Rclone Stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip python3-pip python3-opencv python3-numpy
          curl -fsSL https://rclone.org/install.sh | sudo bash || sudo apt-get install -y -qq rclone

      - name: Assemble 6 Shards & Upload Batch3 Project 0${{ matrix.proj }} to Google Drive (1_QCDdqFbGcN8bBJ105ZuHYDG-wdPy5Xq)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          IDX="${{ matrix.proj }}"
          SHARD_PREFIX=$(printf "b3v2_shard_%02d_" "$IDX")
          DRIVE_ID="1_QCDdqFbGcN8bBJ105ZuHYDG-wdPy5Xq"

          mkdir -p ~/.config/rclone output_parade
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          gh release download parade-4k60-max-cinema -p "${SHARD_PREFIX}*" -D output_parade --clobber
          python3 scripts/festival_parade_master_pipeline.py "$IDX" \
            --manifest parade_batch3_manifest.json \
            --shard-prefix b3v2_shard \
            --assemble-shards 6

          sleep $(( IDX * 10 ))
          for attempt in 1 2 3 4; do
            if rclone copy output_parade/ "gdrive,root_folder_id=${DRIVE_ID}:Rendered_4K60_Parade_MAX_CINEMA/" \
              --transfers 4 --checkers 8 --drive-chunk-size 128M --multi-thread-streams 4 \
              --retries 6 --retries-sleep 15s -v; then
              break
            fi
            echo "Retry $attempt after Google Drive 429 cooldown..."
            sleep $(( attempt * 20 ))
          done

          for s in 00 01 02 03 04 05; do
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.mp4" -y || true
            gh release delete-asset parade-4k60-max-cinema "${SHARD_PREFIX}${s}.json" -y || true
          done
