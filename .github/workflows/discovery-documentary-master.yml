name: 🎯 Single Video 4K 60fps Master QA (Original Audio + 0.5s Xfade + Clean BGM)

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'Chọn 1 Bộ Phim để xuất chuẩn 4K 60fps & Kiểm tra Âm thanh trước'
        required: true
        default: 'Baya_Weaver_Hanging_Pendulum_Nest_12min'
        type: string
      resolution:
        description: 'Độ phân giải xuất ra'
        required: true
        default: '3840x2160'
        type: choice
        options:
          - '3840x2160'
          - '2560x1440'
          - '1920x1080'
      fps:
        description: 'Số khung hình/giây (FPS)'
        required: true
        default: '60'
        type: choice
        options:
          - '60'
          - '30'
      bgm_volume:
        description: 'Âm lượng nhạc nền Ambient ấm dưới giọng đọc gốc (0.0 = tắt hẳn nhạc nền, 0.14 = dịu nhẹ)'
        required: false
        default: '0.14'
        type: string

jobs:
  render-4k60-single-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Cloud Video Studio
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install OpenCV, gdown & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q gdown opencv-python-headless numpy

      - name: 🎬 Render 1 Video 4K 60fps Master (Keep Original Audio + 0.5s Xfade + Clean BGM)
        run: |
          python scripts/discovery_master_pipeline.py \
            --project-key "${{ inputs.project_key }}" \
            --resolution "${{ inputs.resolution }}" \
            --fps "${{ inputs.fps }}" \
            --bgm-volume "${{ inputs.bgm_volume }}" \
            --output-dir "output"

      - name: 🌐 Publish to GitHub Release `discovery-4k60-qa` for Instant Web Preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="discovery-4k60-qa"
          gh release view "$TAG" || gh release create "$TAG" --title "🎯 4K 60fps Master QA Preview (Original Audio + Clean BGM)" --notes "Single video 4K 60fps QA release with 100% original narration/audio preserved, 0.5s xfade transitions, and zero pink-noise hiss."
          gh release upload "$TAG" output/*.mp4 --clobber
