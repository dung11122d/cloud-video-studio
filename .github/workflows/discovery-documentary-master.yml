name: 🚀 Multi-Threaded Discovery Documentary Cloud Studio (Parallel Matrix + Auto Drive Upload)

on:
  workflow_dispatch:
    inputs:
      batch_selection:
        description: 'Chọn Nhóm Phim để chạy Đa Luồng Song Song (Mỗi phim chạy trên 1 máy chủ 4-vCPU riêng biệt cùng lúc)'
        required: true
        default: 'Batch_1 (Top 6 Flagship Documentaries)'
        type: choice
        options:
          - 'Batch_1 (Top 6 Flagship Documentaries)'
          - 'Batch_2 (Documentaries 7 to 12)'
          - 'Batch_3 (Documentaries 13 to 18)'
          - 'Batch_4 (Documentaries 19 to 24)'
          - 'Batch_5 (Documentaries 25 to 30)'
          - 'ALL_30_DOCUMENTARIES (Chạy đồng loạt cả 30 phim)'
      gdrive_target_folder_id:
        description: 'ID Thư mục Google Drive nhận video thành phẩm (Tùy chọn - kết hợp với RCLONE_CONFIG_BASE64 trong Secrets)'
        required: false
        default: '1wZmfSYFBWDwhydvtFGR9eK-GKspjvJlz'
        type: string

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      projects_json: ${{ steps.set-matrix.outputs.projects_json }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          python3 - << 'EOF'
          import json, os
          manifest = json.load(open("scripts/drive_manifest.json", encoding="utf-8-sig"))
          keys = list(manifest.keys())
          choice = "${{ inputs.batch_selection }}"
          if choice.startswith("Batch_1"):
              selected = keys[0:6]
          elif choice.startswith("Batch_2"):
              selected = keys[6:12]
          elif choice.startswith("Batch_3"):
              selected = keys[12:18]
          elif choice.startswith("Batch_4"):
              selected = keys[18:24]
          elif choice.startswith("Batch_5"):
              selected = keys[24:30]
          else:
              selected = keys
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"projects_json={json.dumps(selected)}\n")
          EOF

  parallel-cloud-render:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        project_key: ${{ fromJson(needs.prepare-matrix.outputs.projects_json) }}

    steps:
      - name: 📥 Checkout Cloud Video Studio
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install OpenCV, gdown, FFmpeg & rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone
          pip install -q --upgrade pip
          pip install -q gdown opencv-python-headless numpy

      - name: ⚡ Multi-Threaded Edit, AI Cleanup, Cinema Grade & Sound Design
        run: |
          python scripts/discovery_master_pipeline.py \
            --project-key "${{ matrix.project_key }}" \
            --output-dir "output"

      - name: ☁️ Auto-Upload to Google Drive (via Rclone if configured)
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          TARGET_FOLDER_ID: ${{ inputs.gdrive_target_folder_id }}
        run: |
          if [ -n "$RCLONE_CONFIG_B64" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
            echo "Uploading rendered master video to Google Drive folder $TARGET_FOLDER_ID..."
            rclone copy output/ gdrive:Rendered_Discovery_Masters --drive-root-folder-id "$TARGET_FOLDER_ID" -P
          else
            echo "ℹ️ RCLONE_CONFIG_BASE64 secret not set yet; publishing to GitHub Releases & Artifacts for instant web download."
          fi

      - name: 🌐 Publish to GitHub Release (Direct Web Download Link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="discovery-masters-v1"
          gh release view "$TAG" || gh release create "$TAG" --title "🌍 Rendered Discovery Documentaries (1080p Cinema Master + SEO)" --notes "Auto-rendered Discovery Documentary Masters with AI Artifact Removal, Cinema Color Grade, and Multi-Layer Soundscape."
          gh release upload "$TAG" output/*.mp4 output/*.json --clobber

      - name: 📦 Save to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Master-${{ matrix.project_key }}
          path: |
            output/*.mp4
            output/*.json
          retention-days: 14
