name: 🌍 Discovery Documentary Master (72-Scene AI Cleanup, Cinema Grade & Sound Design)

on:
  workflow_dispatch:
    inputs:
      project_choice:
        description: 'Chọn Bộ Phim Tài Liệu Khoa Học trong Google Drive của bạn (Hoặc chọn Custom)'
        required: true
        default: 'Baya_Weaver_12min (1yEovNBIIeH6P_f8KJUDD9DiDa3bK76OB)'
        type: choice
        options:
          - 'Baya_Weaver_12min (1yEovNBIIeH6P_f8KJUDD9DiDa3bK76OB)'
          - 'ElfOwl_ScorpionHunter_12min (19LBpBXyktEOYyVtAEQuF3_1PAUdC8Q9k)'
          - 'Great_Eared_Nightjar_Dragon_Bird_12min (1aFeaTiShCiI-8VDQGbuWxUUyT0VwqKS6)'
          - 'GreatHornedOwl_BobcatDuel_12min (1tjWo1X85WuNm3-PKuGtTpIBWh0w7rasZ)'
          - 'Harpy_Eagle_Grizzly_Talons_12min (1tCIaOlg73YtOBel2EoZipYJ6JMw8Ykwd)'
          - 'Long_Wattled_Umbrellabird_12min (1F8R_xGZF7rWFriFCdasf4GCGUM3Dyu8G)'
          - 'RedCockadedWoodpecker_Fortress_12min (1jU-IStubUQfSwHLFZ7ziKdNBxJ9EXG3w)'
          - 'Horned_Coot_Stone_Island_10min (15AOyNDou6UvvVoiivS9IkYehEUoJUlki)'
          - 'Great_Potoo_Camouflage_12min (1J26sIbd473mVFWwskkn5e0-xmOAZLwbT)'
          - 'Barnacle_Goose_400ft_Cliff_Leap_12min (1k2erCqT5FzI5rpk6GsywZFdFQkc7uXh_)'
          - 'Shimaenaga_Snow_Fairy_Nest_12min (13LZYJoOHzgzQPFS2N0FH0c1fWVp0JBCx)'
          - 'Himalayan_Monal_Rainbow_Pheasant_12min (1BR6w1dT2LMiXszKmzFy95AuEqaeLvbau)'
          - 'Southern_Cassowary_Dinosaur_Kick_12min (1pRrUJE9sZxO5UstHHap2zOalg0neNu8L)'
          - 'Rufous_Hornero_Mud_Oven_12min (18ngfSv4q17v3M8AhlXx3T_u3jR4eDBFn)'
          - 'Northern_Gannet_100kmh_Torpedo_12min (1i8i2DQwaX2T-uXVrI31nquMZosCjKyXP)'
          - 'Common_Tailorbird_Stitched_Leaf_12min (1i4UQGMZ7oS9OU-u33OoPOV-_Ds62OLYq)'
          - 'African_Jacana_Lily_Trotter_12min (1Zh2a_g45vyZiN6-JwO_uXgu1Wj6NgApv)'
          - 'Sociable_Weaver_1Ton_Fortress_12min (19BWhGOBT3NB5jbMBx_OI8VladDgsM6tU)'
          - 'Hoatzin_WingClawedChicks_Amazon_12min (1SN6DvqYQAShLfNv9UzORFZBtCN073pq8)'
          - 'Vogelkop_Bowerbird_Architect_12min (1q9wV-QIiHcj3V012qMwnve-6X95j5AmK)'
          - 'SnowyOwl_ArcticTundra_FoxStrike_12min (17kQd9eNJH0IFlZDp1D54lCS56XVzrZGf)'
          - 'GreatGreyOwl_Acoustic_SnowPlunge_12min (1qMWAk6Y0Tr60qDXfXYEdkptZfLMExXOO)'
          - 'BarnOwl_0dB_Stealth_RatSnake_12min (1ubpytteDybPIq7WhUElCZ5DFv1uAIoiw)'
      custom_drive_folder:
        description: 'Hoặc nhập link/ID thư mục Google Drive tùy chỉnh (nếu có)'
        required: false
        default: ''
        type: string
      max_scenes:
        description: 'Số lượng cảnh tối đa cần ghép (Mặc định: 72 cảnh = ~12 phút)'
        required: false
        default: '72'
        type: string

jobs:
  discovery-cloud-master:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Cloud Studio
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install OpenCV, gdown & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install gdown opencv-python-headless numpy

      - name: 🎬 Run AI Artifact Filter, Discovery Color Grading & Sound Design on Cloud
        run: |
          CHOICE="${{ inputs.project_choice }}"
          CUSTOM="${{ inputs.custom_drive_folder }}"
          if [ -n "$CUSTOM" ]; then
            FOLDER_ID="$CUSTOM"
            TOPIC="Custom_Discovery_Documentary"
          else
            TOPIC=$(echo "$CHOICE" | awk '{print $1}')
            FOLDER_ID=$(echo "$CHOICE" | sed -n 's/.*(\(.*\)).*/\1/p')
          fi
          echo "Processing Topic: $TOPIC | Drive Folder ID: $FOLDER_ID"
          python scripts/discovery_master_pipeline.py \
            --drive-folder "https://drive.google.com/drive/folders/$FOLDER_ID" \
            --topic-name "$TOPIC" \
            --max-scenes "${{ inputs.max_scenes }}" \
            --output-dir "output"

      - name: 📤 Upload Rendered Master Video & SEO Package to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Discovery-Master-Video-And-SEO
          path: |
            output/*.mp4
            output/meta.json
            output/ai_qc_report.json
          retention-days: 14
