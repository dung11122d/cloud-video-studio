name: Direct Cloud-to-Drive 4K60 MAX CINEMA - Link 5 Batches (b1..b7)

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch manifest (b1, b2, b3, b4, b5, b6, b7)"
        required: true
        default: "b1"
        type: choice
        options:
          - b1
          - b2
          - b3
          - b4
          - b5
          - b6
          - b7
      target:
        description: "Target (all, assemble_only, 1..8)"
        required: false
        default: "all"

permissions:
  contents: write
  actions: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Build Project Matrix
        id: set-matrix
        run: |
          python3 - << 'EOF'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("scripts/parade_link5_${{ inputs.batch }}_manifest.json").read_text(encoding="utf-8"))
          target = "${{ inputs.target }}".strip()
          if target in ("", "all", "assemble_only"):
              projs = [p["idx"] for p in manifest]
          else:
              projs = [int(target)]
          print("Selected projects:", projs)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"projects={json.dumps(projs)}\n")
          EOF

  render-link5-shards:
    needs: prepare-matrix
    if: ${{ github.event.inputs.target != 'assemble_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        proj: ${{ fromJson(needs.prepare-matrix.outputs.projects) }}
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Check If Shard Already Rendered
        id: check_shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHARD_MP4=$(printf "l5_${{ inputs.batch }}_shard_%02d_%02d.mp4" "${{ matrix.proj }}" "${{ matrix.shard }}")
          if gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${SHARD_MP4}$"; then
            echo "Shard ${SHARD_MP4} already exists on GitHub Release - skipping render!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Multimedia Stack
        if: steps.check_shard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy gdown yt-dlp

      - name: Render 4K60 Shard ${{ matrix.shard }}/6 for Link 5 ${{ inputs.batch }} Project ${{ matrix.proj }}
        if: steps.check_shard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          python3 scripts/festival_parade_master_pipeline.py "${{ matrix.proj }}" \
            --manifest "parade_link5_${{ inputs.batch }}_manifest.json" \
            --shard-prefix "l5_${{ inputs.batch }}_shard" \
            --shard-idx "${{ matrix.shard }}" \
            --num-shards 6

          echo "Uploading rendered shard to GitHub Release..."
          gh release upload parade-4k60-max-cinema output_parade/l5_${{ inputs.batch }}_shard_* --clobber

  assemble-link5-projects:
    needs: [prepare-matrix, render-link5-shards]
    if: ${{ always() && needs.prepare-matrix.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        proj: ${{ fromJson(needs.prepare-matrix.outputs.projects) }}
    steps:
      - name: Free Runner Disk Space (35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Rclone & Headless Stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy

      - name: Check All 6 Shards & Assemble to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          IDX="${{ matrix.proj }}"
          SHARD_PREFIX=$(printf "l5_${{ inputs.batch }}_shard_%02d_" "$IDX")
          DRIVE_ID="1MY39AdjhDPO4F3apviQH0iMTIKhiS33e"
          MASTER_ID="1ko72inz1CYBvwYQ3RDnSkYmi1uS50ae9"
          VIEW_ID="1U_l0CUNqK6ckQFyQuGv-qoYY8GCAVM9s"

          mkdir -p ~/.config/rclone output_parade
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          echo "Checking rendered shards for Link 5 ${{ inputs.batch }} Project $IDX..."
          ALL_EXIST=true
          for s in 0 1 2 3 4 5; do
            S_NAME=$(printf "l5_${{ inputs.batch }}_shard_%02d_%02d.mp4" "$IDX" "$s")
            if ! gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${S_NAME}$"; then
              echo "Missing shard: $S_NAME"
              ALL_EXIST=false
            fi
          done

          if [ "$ALL_EXIST" != "true" ]; then
            echo "Not all 6 shards exist for Project $IDX - skipping assemble."
            exit 1
          fi

          echo "Downloading all 6 shards for Project $IDX..."
          gh release download parade-4k60-max-cinema -p "${SHARD_PREFIX}*" -D output_parade/ --clobber

          echo "Assembling Project $IDX..."
          python3 scripts/festival_parade_master_pipeline.py "$IDX" \
            --manifest "parade_link5_${{ inputs.batch }}_manifest.json" \
            --shard-prefix "l5_${{ inputs.batch }}_shard" \
            --assemble-shards 6

          echo "Cleaning up local shards before upload..."
          rm -f output_parade/${SHARD_PREFIX}*

          echo "Direct sync master video to Link 5 folder..."
          rclone copy output_parade/ "gdrive,root_folder_id=${DRIVE_ID}:Rendered_4K60_Parade_MAX_CINEMA" \
            --include "*_4K60_MAX_CINEMA.mp4" \
            --include "*_QA_Report.json" \
            --include "*_SEO_meta.json" \
            --drive-chunk-size 128M \
            --ignore-existing \
            --retries 5 \
            --low-level-retries 10 \
            --transfers 2 --fast-list -v

          echo "Direct sync master video to Unified Master Folder..."
          rclone copy output_parade/ "gdrive,root_folder_id=${MASTER_ID}:" \
            --include "*_4K60_MAX_CINEMA.mp4" \
            --include "*_QA_Report.json" \
            --include "*_SEO_meta.json" \
            --drive-chunk-size 128M \
            --ignore-existing \
            --retries 5 \
            --low-level-retries 10 \
            --transfers 2 --fast-list -v

          echo "Direct sync master video to Active View Master Folder..."
          rclone copy output_parade/ "gdrive,root_folder_id=${VIEW_ID}:" \
            --include "*_4K60_MAX_CINEMA.mp4" \
            --include "*_QA_Report.json" \
            --include "*_SEO_meta.json" \
            --drive-chunk-size 128M \
            --ignore-existing \
            --retries 5 \
            --low-level-retries 10 \
            --transfers 2 --fast-list -v

          echo "Assemble and triple-sync for Link 5 ${{ inputs.batch }} Project $IDX completed successfully!"
