name: Direct Cloud-to-Drive 4K60 MAX CINEMA - Mario Edition (Episodes 1, 2, 3)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target (all, assemble_only, 1, 2, 3)"
        required: false
        default: "all"

permissions:
  contents: write
  actions: write

jobs:
  # =========================================================================
  # 1. RENDER 4K60 SHARDS IN PARALLEL (3 PROJECTS: 1..3, 3 SHARDS EACH = 9 JOBS)
  # =========================================================================
  render-mario-shards:
    if: ${{ github.event.inputs.target != 'assemble_only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        proj: [1, 2, 3]
        shard: [0, 1, 2]
    steps:
      - name: Filter Target Project
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CURRENT_PROJ="${{ matrix.proj }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "all" ] && [ "$TARGET" != "$CURRENT_PROJ" ]; then
            echo "Skipping Project $CURRENT_PROJ (Target is $TARGET)"
            exit 0
          fi

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Check If Shard Already Rendered
        id: check_shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHARD_MP4=$(printf "mario_shard_%02d_%02d.mp4" "${{ matrix.proj }}" "${{ matrix.shard }}")
          if gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${SHARD_MP4}$"; then
            echo "Shard ${SHARD_MP4} already exists on GitHub Release - skipping render!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Multimedia Stack
        if: steps.check_shard.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy gdown yt-dlp

      - name: Render 4K60 Shard ${{ matrix.shard }}/3 for Mario Project ${{ matrix.proj }}
        if: steps.check_shard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          python3 scripts/festival_parade_master_pipeline.py "${{ matrix.proj }}" \
            --manifest mario_manifest.json \
            --shard-prefix mario_shard \
            --shard-idx "${{ matrix.shard }}" \
            --num-shards 3

          echo "Uploading rendered shard to GitHub Release..."
          gh release upload parade-4k60-max-cinema output_parade/mario_shard_* --clobber

  # =========================================================================
  # 2. ASSEMBLE 3 SHARDS & SYNC DIRECTLY TO GOOGLE DRIVE
  # =========================================================================
  assemble-mario-projects:
    needs: render-mario-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        proj: [1, 2, 3]
    steps:
      - name: Filter Target Project
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CURRENT_PROJ="${{ matrix.proj }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "all" ] && [ "$TARGET" != "assemble_only" ] && [ "$TARGET" != "$CURRENT_PROJ" ]; then
            echo "Skipping Project $CURRENT_PROJ (Target is $TARGET)"
            exit 0
          fi

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Install Rclone & Headless Stack
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg rclone python3-pip
          pip3 install --break-system-packages -q opencv-python-headless numpy

      - name: Check All 3 Shards & Assemble to Google Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GDRIVE_RCLONE_CONF: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          set -e
          IDX="${{ matrix.proj }}"
          SHARD_PREFIX=$(printf "mario_shard_%02d_" "$IDX")
          DRIVE_ID="1yepQpdFR5xt4YLOaSijcp2d6fHeDIbKf"
          MASTER_ID="1ko72inz1CYBvwYQ3RDnSkYmi1uS50ae9"

          mkdir -p ~/.config/rclone output_parade
          echo "$GDRIVE_RCLONE_CONF" > ~/.config/rclone/rclone.conf

          echo "Checking rendered shards for Mario Project $IDX..."
          ALL_EXIST=true
          for s in 0 1 2; do
            S_NAME=$(printf "mario_shard_%02d_%02d.mp4" "$IDX" "$s")
            if ! gh release view parade-4k60-max-cinema --json assets -q ".assets[].name" | grep -q "^${S_NAME}$"; then
              echo "Missing shard: $S_NAME"
              ALL_EXIST=false
            fi
          done

          if [ "$ALL_EXIST" != "true" ]; then
            echo "Not all 3 shards exist for Mario Project $IDX - skipping assemble."
            exit 1
          fi

          echo "Downloading all 3 shards for Mario Project $IDX..."
          gh release download parade-4k60-max-cinema -p "${SHARD_PREFIX}*" -D output_parade/ --clobber

          echo "Assembling Mario Project $IDX..."
          python3 scripts/festival_parade_master_pipeline.py "$IDX" \
            --manifest mario_manifest.json \
            --shard-prefix mario_shard \
            --assemble-shards 3

          echo "Cleaning up local shards before upload..."
          rm -f output_parade/${SHARD_PREFIX}*

          echo "Direct sync master video to Link 2 folder..."
          rclone copy output_parade/ "gdrive,root_folder_id=${DRIVE_ID}:Rendered_4K60_Parade_MAX_CINEMA" \
            --include "*_4K60_MAX_CINEMA.mp4" \
            --include "*_QA_Report.json" \
            --include "*_SEO_meta.json" \
            --drive-chunk-size 128M \
            --ignore-existing \
            --retries 5 \
            --low-level-retries 10 \
            --transfers 2 --fast-list -v

          echo "Direct sync master video to Unified Master Folder..."
          rclone copy output_parade/ "gdrive,root_folder_id=${MASTER_ID}:" \
            --include "*_4K60_MAX_CINEMA.mp4" \
            --include "*_QA_Report.json" \
            --include "*_SEO_meta.json" \
            --drive-chunk-size 128M \
            --ignore-existing \
            --retries 5 \
            --low-level-retries 10 \
            --transfers 2 --fast-list -v

          echo "Assemble and dual-sync for Mario Project $IDX completed successfully!"
