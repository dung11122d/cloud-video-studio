name: 💎 Remaster 30 Videos to 4K 60fps MAX CINEMA (45 Mbps CRF 15 + Lanczos + CAS)

on:
  workflow_dispatch:
    inputs:
      project_filter:
        description: 'Nhập ALL để nâng cấp toàn bộ 30 phim lên 4K60 Max Cinema 45Mbps'
        required: true
        default: 'ALL'
        type: string

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 🧩 Get All 30 MP4 Assets from `discovery-4k60-masters`
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess
          out = subprocess.check_output(["gh", "release", "view", "discovery-4k60-masters", "--json", "assets"], text=True)
          assets = json.loads(out).get("assets", [])
          mp4s = [a["name"] for a in assets if a["name"].endswith("_4K60FPS_Master.mp4")]
          pf = "${{ inputs.project_filter }}".strip()
          if pf and pf.upper() != "ALL":
              mp4s = [m for m in mp4s if pf.lower() in m.lower()]
          print(f"Found {len(mp4s)} 4K60 masters to remaster to MAX CINEMA 45Mbps.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(mp4s)}\n")
          EOF

      - name: 🌐 Ensure Release `discovery-4k60-max-cinema` Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="discovery-4k60-max-cinema"
          gh release view "$TAG" || gh release create "$TAG" \
            --title "💎 30 Discovery Documentaries — 4K 60fps MAX CINEMA 45Mbps (CRF 15 + Lanczos + CAS)" \
            --notes "Ultra-High-Bitrate 4K 60fps (3840x2160 @ 60fps, CRF 15, Maxrate 45 Mbps, CAS + Unsharp Cinema Sharpening, -14 LUFS Broadcast Audio) Masters."

  remaster-max-cinema:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        mp4_name: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: 📦 Install FFmpeg & rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone

      - name: 📥 Download Source 4K60 Master from GitHub Internal Network (Zero Google Quota!)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MP4_NAME: ${{ matrix.mp4_name }}
        run: |
          mkdir -p input output
          gh release download "discovery-4k60-masters" -p "$MP4_NAME" -D input --clobber
          BASE="${MP4_NAME%_4K60FPS_Master.mp4}"
          gh release download "discovery-4k60-masters" -p "${BASE}_SEO_meta.json" -p "${BASE}_QA_Report.json" -D output --clobber || true

      - name: 💎 Cinema Optical Remaster (CAS Sharpening + 3D Denoise + 45 Mbps High@L5.2 CRF 15)
        env:
          MP4_NAME: ${{ matrix.mp4_name }}
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -i "input/$MP4_NAME" \
            -vf "hqdn3d=1.0:0.8:2.0:1.5,cas=strength=0.50,unsharp=5:5:0.65:3:3:0.20,eq=contrast=1.03:saturation=1.05,format=yuv420p" \
            -c:v libx264 -preset veryfast -profile:v high -level:v 5.2 \
            -crf 15 -maxrate 45M -bufsize 90M \
            -c:a copy \
            -movflags +faststart \
            "output/$MP4_NAME"
          rm -rf input
          ls -lh "output/$MP4_NAME"

      - name: ☁️ Auto-Sync Full >2GB File to Google Drive (if RCLONE_CONFIG_BASE64 is configured)
        env:
          RCLONE_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          DRIVE_FOLDER_ID: '1wZmfSYFBWDwhydvtFGR9eK-GKspjvJlz'
        run: |
          if [ -n "$RCLONE_B64" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_B64" | base64 -d > ~/.config/rclone/rclone.conf
            rclone copy output/ gdrive:Rendered_4K60_Discovery_Masters --drive-root-folder-id "$DRIVE_FOLDER_ID" --drive-chunk-size 128M
          fi

      - name: 🌐 Publish to Release `discovery-4k60-max-cinema` (with Lossless 1.9GB Split if >2GB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MP4_NAME: ${{ matrix.mp4_name }}
        run: |
          TAG="discovery-4k60-max-cinema"
          mp4="output/$MP4_NAME"
          sz=$(stat -c%s "$mp4")
          if [ "$sz" -gt 2000000000 ]; then
            echo "📦 Video $mp4 is $((sz / 1048576)) MB (>2GB Cinema Max Bitrate); splitting into lossless 1900MB parts..."
            split -b 1900M -d -a 2 "$mp4" "${mp4}.part"
            rm -f "$mp4"
          fi
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" output/* --clobber && break
            sleep $((attempt * 4))
          done
